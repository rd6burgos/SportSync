{% extends 'base.html' %}

{% block content %}
<h1>Crear Nueva Actividad</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }} <!-- Renderiza los campos automáticamente -->
    <button type="submit" class="btn btn-success">Guardar Actividad</button>
    <a href="{% url 'actividades:lista' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
